# Forge IA — service d'extraction PDF/DOCX
# Déploiement : depuis ce dossier, `docker compose -f docker-compose.extractor.yml up -d --build`
# Publie 3002 sur l'hôte -> joignable par n8n_local via http://host.docker.internal:3002
services:
  forge-extractor:
    build: .
    image: forge-extractor:1.0.0
    container_name: forge-extractor
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
