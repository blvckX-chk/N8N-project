# Forge IA — déploiement VPS (réseau privé, AUCUN port publié)
# Accès uniquement via le reverse proxy Caddy (sous-domaine HTTPS).
# Les services se joignent par NOM DE CONTENEUR sur le réseau forge_net.
#   Déploiement : docker compose -f docker-compose.vps.yml --env-file .env.vps up -d --build
name: forge-ia

networks:
  forge_net:
    name: forge_net

volumes:
  forge_n8n_data:
  forge_memory_data:
  forge_deploy_apps:

services:
  forge-n8n:
    image: n8nio/n8n:1.123.77          # version classique (runner interne) — compat agents
    container_name: forge-n8n
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Africa/Porto-Novo
      - TZ=Africa/Porto-Novo
      # Secrets lus par l'agent Knowledge/Memory ($env) :
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TCHAVI_API_KEY=${TCHAVI_API_KEY}
      - MEMORY_URL=http://forge-memory:4002
      - MEMORY_TOKEN=${MEMORY_TOKEN}
      # Derrière Caddy :
      - N8N_PROXY_HOPS=1
      # Accès éditeur n8n via sous-domaine (Caddy + Cloudflare). FORGE_N8N_DOMAIN
      # doit être renseigné dans .env.vps (ex. n8n.tondomaine.bj).
      - N8N_HOST=${FORGE_N8N_DOMAIN:-}
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${FORGE_N8N_DOMAIN:-localhost}/
    volumes:
      - forge_n8n_data:/home/node/.n8n
    networks: [forge_net]

  forge-memory:
    build: ./memory-service
    image: forge-memory:1.0.0
    container_name: forge-memory
    restart: unless-stopped
    environment:
      - PORT=4002
      - MEMORY_DB_PATH=/data/memory.db
      - MEMORY_TOKEN=${MEMORY_TOKEN}
    volumes:
      - forge_memory_data:/data
    networks: [forge_net]

  forge-extractor:
    build: ./pdf-extractor
    image: forge-extractor:1.0.0
    container_name: forge-extractor
    restart: unless-stopped
    environment:
      - PORT=3002
    networks: [forge_net]

  forge-semgrep:
    build: ./services/semgrep-scanner
    image: forge-semgrep:1.0.0
    container_name: forge-semgrep
    restart: unless-stopped
    environment:
      - PORT=8000
    networks: [forge_net]

  forge-deploy:
    build: ./deploy-service
    image: forge-deploy:1.0.0
    container_name: forge-deploy
    restart: unless-stopped
    environment:
      - PORT=4001
      - PUBLIC_HOST=${FORGE_DOMAIN}
      - APPS_DIR=/data/apps
      - PORT_MIN=4100
      - PORT_MAX=4110
      # Proxy "app active" : les apps deployees sont exposees publiquement a
      # https://${FORGE_APP_DOMAIN} via Caddy -> forge-deploy:4099 (app active).
      - PREVIEW_PORT=4099
      - PUBLIC_APP_URL=https://${FORGE_APP_DOMAIN}
    volumes:
      - forge_deploy_apps:/data
    networks: [forge_net]

  forge-panel:
    build: ./frontend-forge-ia
    image: forge-panel:latest
    container_name: forge-panel
    restart: unless-stopped
    environment:
      - PORT=3000
      - N8N_URL=http://forge-n8n:5678/webhook/pipeline
      - DEPLOY_URL=http://forge-deploy:4001
      - FORGE_USER=${FORGE_USER}
      - FORGE_PASS=${FORGE_PASS}
    networks: [forge_net]
